
services:
  postgres:
    image: postgres:17
    container_name: orderflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow_dev
      POSTGRES_DB: orderflow
    ports:
      - "5432:5432"
    volumes:
      - orderflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderflow -d orderflow"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres-test:
    image: postgres:17
    container_name: orderflow-postgres-test
    environment:
      POSTGRES_USER: orderflow
      POSTGRES_PASSWORD: orderflow_test
      POSTGRES_DB: orderflow_test
    ports:
      - "5433:5432"
    volumes:
      - orderflow_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderflow -d orderflow_test"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: orderflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - orderflow_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  orderflow_data:
  orderflow_test_data:
  orderflow_redis_data:
